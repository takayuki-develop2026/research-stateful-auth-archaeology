# ============================================================
# Global Settings
# ============================================================
# Dockerの内部DNSサーバーを指定 (ipv6をオフにし、10秒ごとに再解決)
resolver 127.0.0.11 ipv6=off valid=10s;

upstream frontend {
    server frontend_dev:3000;
}

# ============================================================
# HTTP (80) - localhost
# ============================================================
server {
    listen 80;
    server_name localhost;

    root /var/www/backend/public;
    index index.php;

    # Laravel storage
    location ^~ /storage/ {
        try_files $uri =404;
        access_log off;
        expires 30d;
    }

    location ^~ /pictures_user/ {
        try_files $uri =404;
        access_log off;
        expires 30d;
    }

    # 🔐 Auth POST only (Laravel)
    location = /login {
        if ($request_method = POST) {
            rewrite ^ /index.php last;
        }
        proxy_pass http://frontend;
    }

    location = /logout {
        if ($request_method = POST) {
            rewrite ^ /index.php last;
        }
        proxy_pass http://frontend;
    }

    # ✅ Webhooks -> Laravel (Stripe etc.)
    location ^~ /webhooks/ {
        try_files $uri /index.php?$query_string;
    }

    # ✅ OCRテスト用 fixtures
    location ^~ /fixtures/ {
      alias /var/www/backend/storage/app/fixtures/;
      try_files $uri =404;
      access_log off;
      expires -1;
      add_header Cache-Control "no-store";
      types { application/pdf pdf; }
    }

    # Laravel API / Sanctum
    location ^~ /api/ {
        try_files $uri /index.php?$query_string;
    }

    location ^~ /sanctum/ {
        try_files $uri /index.php?$query_string;
    }

    # PHP-FPM
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    # Next.js (frontend)
    location / {
        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto http;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

# ============================================================
# HTTPS (443) - localhost
# ============================================================
server {
    listen 443 ssl http2;
    server_name localhost;

    ssl_certificate     /etc/nginx/ssl/localhost.pem;
    ssl_certificate_key /etc/nginx/ssl/localhost-key.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    root /var/www/backend/public;
    index index.php;

    location ^~ /storage/ {
        try_files $uri =404;
        access_log off;
        expires 30d;
    }

    location ^~ /pictures_user/ {
        try_files $uri =404;
        access_log off;
        expires 30d;
    }

    location = /login {
        if ($request_method = POST) {
            rewrite ^ /index.php last;
        }
        proxy_pass http://frontend;
    }

    location = /logout {
        if ($request_method = POST) {
            rewrite ^ /index.php last;
        }
        proxy_pass http://frontend;
    }

    location ^~ /webhooks/ {
        try_files $uri /index.php?$query_string;
    }

    location ^~ /api/ {
        try_files $uri /index.php?$query_string;
    }

    location ^~ /sanctum/ {
        try_files $uri /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    location / {
        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

# ============================================================
# ORACLE (80) -> 443へリダイレクト
# ============================================================
server {
    listen 80;
    server_name oracle.singularity.local;

    return 301 https://$host$request_uri;
}

# ============================================================
# ORACLE (443) - 動的IP追従設定
# ============================================================
server {
    listen 443 ssl http2;
    server_name oracle.singularity.local;

    ssl_certificate     /etc/nginx/ssl/oracle.crt;
    ssl_certificate_key /etc/nginx/ssl/oracle.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # 🚀 動的IP追従のための変数利用
    location / {
        # 変数を使用することでresolverによる名前解決を強制
        set $oracle_upstream "oracle";
        proxy_pass http://$oracle_upstream:80;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}