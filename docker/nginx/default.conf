    location = /login {
        if ($request_method = POST) {
            rewrite ^ /index.php last;
        }
        proxy_pass http://frontend;
    }

    location = /logout {
        if ($request_method = POST) {
            rewrite ^ /index.php last;
        }
        proxy_pass http://frontend;
    }

    # ===============================
    # ✅ Webhooks -> Laravel (Stripe etc.)
    # ===============================
    location ^~ /webhooks/ {
        try_files $uri /index.php?$query_string;
    }

    # ===============================
    # Laravel API / Sanctum
    # ===============================
    location ^~ /api/ {
        try_files $uri /index.php?$query_string;
    }

    location ^~ /sanctum/ {
        try_files $uri /index.php?$query_string;
    }

    # ===============================
    # PHP-FPM
    # ===============================
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    # ===============================
    # Next.js (frontend)
    # ===============================
    location / {
        proxy_pass http://frontend;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

# ============================================================
# ORACLE (80) -> 443へリダイレクト
# ============================================================
server {
    listen 80;
    server_name oracle.singularity.local;

    return 301 https://$host$request_uri;
}

# ============================================================
# ORACLE (443) - TLS終端して oracle:80 へ proxy
# ============================================================
server {
    listen 443 ssl http2;
    server_name oracle.singularity.local;

    ssl_certificate     /etc/nginx/ssl/oracle.crt;
    ssl_certificate_key /etc/nginx/ssl/oracle.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # pricing_v1.json を返す oracle コンテナへ転送
    location / {
        proxy_pass http://oracle:80;
        proxy_set_header Host $host;
    }
}


