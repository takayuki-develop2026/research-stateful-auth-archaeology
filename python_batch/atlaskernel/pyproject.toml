[tool.poetry]
name = "atlaskernel"
version = "0.1.0"
description = "AtlasKernel - Entity Analysis Engine (MVP)"
authors = ["OpenAI User <dev@example.com>"]
packages = [{ include = "atlaskernel", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.12,<3.13"

pydantic = ">=2.6"
rapidfuzz = ">=3.6"
jsonschema = ">=4.23"
PyYAML = ">=6.0"

fastapi = ">=0.115.0"
uvicorn = { extras = ["standard"], version = ">=0.30.0" }

mysql-connector-python = "==9.5.0"
sqlalchemy = ">=2.0"

pdfminer-six = ">=20231228"
pillow = ">=10.0"
pdf2image = ">=1.17"
pytesseract = ">=0.3.10"

opencv-python = ">=4.10,<5.0"
numpy = ">=1.26,<3.0"

# PaddleOCR 本体
paddleocr = ">=2.8,<3.0"

# Linux / CPU 前提の無難寄り
# 環境によっては install 時にバージョン調整が必要
paddlepaddle = ">=2.6,<3.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0"
pytest-cov = ">=5.0"
black = ">=24.0"
ruff = ">=0.6.0"

[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"