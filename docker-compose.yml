# version: "3.8"

services:
  # ============================================================
  # 1) Nginx（Reverse Proxy）
  # ============================================================
  
  nginx:
    build: ./docker/nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./backend:/var/www/backend
      - ./docker/nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - php
      - frontend_dev
      - oracle
    networks:
      simulation1_network:
        aliases:
          - oracle.singularity.local

  # ============================================================
  # 2) PHP-FPM（Laravel）
  # ============================================================
  php:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    image: research-stateful-auth-archaeology-php:latest
    working_dir: /var/www/backend
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/var/www/backend
      - ./python_batch:/var/www/python_batch
    command: php-fpm
    depends_on:
      - mysql
    networks:
      - simulation1_network

  # ============================================================
  # 3) MySQL
  # ============================================================
  mysql:
    image: mysql:8.3
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: laravel_db
      MYSQL_USER: laravel_user
      MYSQL_PASSWORD: laravel_pass
      TZ: Asia/Tokyo
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - simulation1_network

  # ============================================================
  # 4) phpMyAdmin
  # ============================================================
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    platform: linux/amd64
    environment:
      PMA_ARBITRARY: 1
      PMA_HOST: mysql
      PMA_USER: laravel_user
      PMA_PASSWORD: laravel_pass
    depends_on:
      - mysql
    ports:
      - "8080:80"
    networks:
      - simulation1_network

  # ============================================================
  # 5) MailHog
  # ============================================================
  mailhog:
    image: mailhog/mailhog:latest
    platform: linux/amd64
    restart: always
    ports:
      - "8025:8025"
      - "1025:1025"
    networks:
      - simulation1_network

  # ============================================================
  # 6) Next.js（dev）
  # ============================================================
  frontend_dev:
    build:
      context: ./frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/.next
      - /app/node_modules
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
    command: npm run dev -- --port 3000 --hostname 0.0.0.0
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - simulation1_network

  # ============================================================
  # 7) Python（AtlasKernel）
  # ============================================================
  python_atlaskernel:
    build: ./python_batch/atlaskernel
    ports:
      - "8000:8000"
    working_dir: /app
    volumes:
      - ./python_batch/atlaskernel:/app
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: laravel_db
      DB_USER: laravel_user
      DB_PASS: laravel_pass
      DATABASE_URL: mysql+mysqlconnector://laravel_user:laravel_pass@mysql:3306/laravel_db
      ATLAS_BRANDS_HINT_PATH: /app/src/atlaskernel/assets/brands_v1.txt
      ATLAS_CONDITIONS_HINT_PATH: /app/src/atlaskernel/assets/conditions_v1.txt
      ATLAS_COLORS_HINT_PATH: /app/src/atlaskernel/assets/colors_v1.txt
    command: >
      uvicorn atlaskernel.server:app
      --host 0.0.0.0
      --port 8000
    networks:
      - simulation1_network



  # ============================================================
  # 8) PaymentCore（TrustLedger Core / Spring Boot）
  # ============================================================
  payment_core:
    build:
      context: ./payment_core
    ports:
      - "8081:8081"
    environment:
      # 任意：Laravel -> PaymentCore の最小認証（X-TrustLedger-Key）
      TRUSTLEDGER_API_KEY: dev-secret
      SERVER_PORT: 8081
      TZ: Asia/Tokyo
    networks:
      - simulation1_network




  # ============================================================
  # 9) Admin UI（Rails）
  # ============================================================
  admin_rails:
    image: ruby:4.0.1
    working_dir: /app
    volumes:
      - ./admin_rails:/app
    env_file:
      - ./admin_rails/.env
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USERNAME: laravel_user
      DB_PASSWORD: laravel_pass
      DB_DATABASE: admin_rails_development
      DECISIONCORE_BASE_URL: http://decisioncore_server:9023
      LEDGERSVC_BASE_URL: http://ledgersvc-server:9031
      ATLASKERNEL_DEFAULT_PROJECT_ID: akproj_0000000000000000000
    command: bash -lc "rm -f /app/tmp/pids/server.pid && bundle install && bin/rails server -b 0.0.0.0 -p 3000"
    ports:
      - "3001:3000"
    depends_on:
      - mysql
    networks:
      - simulation1_network

  # ============================================================
  # 10) AK v3 - PostgreSQL（SoT）
  # ============================================================
  ak_postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ak
      POSTGRES_USER: ak
      POSTGRES_PASSWORD: ak
      TZ: Asia/Tokyo
    ports:
      - "5433:5432"   # 既存と衝突しにくいようにホスト側は 5433
    volumes:
      - ak_pgdata:/var/lib/postgresql/data
      - ./pisag_go/migrations:/docker-entrypoint-initdb.d # 起動時にマイグレーションを自動実行
    networks:
      - simulation1_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ak -d ak"]
      interval: 5s
      timeout: 3s
      retries: 20

  # ============================================================
  # 11) AK v3 - Redis（lock/cache/rate-limit）
  # ============================================================
  ak_redis:
    image: redis:7
    ports:
      - "6380:6379"   # 既存と衝突しにくいようにホスト側は 6380
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ak_redisdata:/data
    networks:
      - simulation1_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # ============================================================
  # 12) AK v3 - Go Core（run/trace/run_events）
  # ============================================================
  ak_go_core:
    build:
      context: .  # プロジェクトのルートディレクトリに広げる
      dockerfile: ak_go_core/Dockerfile # Dockerfileへのパスを正しく指定
    image: research-stateful-auth-archaeology/ak-go-core:v4 # バージョンをv4へ
    ports:
      - "9000:9000"
    environment:
      DATABASE_URL: postgres://ak_worker:ak_worker@ak_postgres:5432/ak?sslmode=disable
      OWNER_DATABASE_URL: postgres://ak:ak@ak_postgres:5432/ak?sslmode=disable
      AK_DB_DSN: postgres://ak:ak@ak_postgres:5432/ak?sslmode=disable
      AK_REDIS_ADDR: ak_redis:6379
      AK_SERVICE_NAME: ak-go-core
      AK_POLICY_VERSION: v3
      AK_PIPELINE_VERSION: v3
      TZ: Asia/Tokyo
    depends_on:
      ak_postgres:
        condition: service_healthy
      ak_redis:
        condition: service_healthy
    networks:
      - simulation1_network
    restart: unless-stopped

  # ============================================================
  # worker「常時2台」設定（buildなし：同一imageを参照）
  # ============================================================
  ak_go_worker:
    image: research-stateful-auth-archaeology/ak-go-core:v4
    environment:
      AK_DB_DSN: postgres://ak:ak@ak_postgres:5432/ak?sslmode=disable
      AK_REDIS_ADDR: ak_redis:6379
      AK_WORKER_NAME: worker-1
      AK_WORKER_ID: worker-1
      TZ: Asia/Tokyo
    command: ["/app/worker"]
    depends_on:
      ak_postgres:
        condition: service_healthy
      ak_redis:
        condition: service_healthy
    networks:
      - simulation1_network
    restart: unless-stopped

  ak_go_worker_2:
    image: research-stateful-auth-archaeology/ak-go-core:v4
    environment:
      AK_DB_DSN: postgres://ak:ak@ak_postgres:5432/ak?sslmode=disable
      AK_REDIS_ADDR: ak_redis:6379
      AK_WORKER_NAME: worker-2
      AK_WORKER_ID: worker-2
      TZ: Asia/Tokyo
    command: ["/app/worker"]
    depends_on:
      ak_postgres:
        condition: service_healthy
      ak_redis:
        condition: service_healthy
    networks:
      - simulation1_network
    restart: unless-stopped

  # ============================================================
  # 13) CloudBeaver（DB GUI: Postgres/MySQL）
  # ============================================================
  cloudbeaver:
    image: dbeaver/cloudbeaver:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8978:8978"   # 外に公開しない（ローカルのみ）
    volumes:
      - cloudbeaver_workspace:/opt/cloudbeaver/workspace
    depends_on:
      ak_postgres:
        condition: service_healthy
      mysql:
        condition: service_started
    networks:
      - simulation1_network


  # ============================================================
  # 14)シミュレーター (Oracle: データの源泉)
  # ============================================================
  oracle:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./oracle_static:/usr/share/nginx/html:ro
    networks:
      - simulation1_network



      # ============================================================
  # 15) v12 Governance Service (govsvc)
  # ============================================================
  govsvc:
    build:
      context: .
      dockerfile: services/govsvc/Dockerfile
    volumes:
      - ./services/govsvc/var:/var/govsvc
    restart: unless-stopped
    ports:
      - "9012:9012"   # host:container（空いてる番号にしてOK）
    environment:
      # AK基盤（Postgres/Redis）に接続
      AK_DB_DSN: postgres://ak:ak@ak_postgres:5432/ak?sslmode=disable
      AK_REDIS_ADDR: ak_redis:6379

      AK_SERVICE_NAME: govsvc
      TZ: Asia/Tokyo
    depends_on:
      ak_postgres:
        condition: service_healthy
      ak_redis:
        condition: service_healthy
    networks:
      - simulation1_network


# ============================================================
  # １６　　　v10) Intelligent Routing Agent (agentsvc)
  # ============================================================
  agentsvc:
    build:
      context: .
      dockerfile: services/agentsvc/Dockerfile
    restart: unless-stopped
    ports:
      - "9010:9010"
    environment:
      AGENTSVC_PORT: "9010"
      AK_DB_DSN: postgres://ak:ak@ak_postgres:5432/ak?sslmode=disable
      AK_REDIS_ADDR: ak_redis:6379
      TZ: Asia/Tokyo
    volumes:
      - ./services/agentsvc/var:/var/agentsvc
    depends_on:
      ak_postgres:
        condition: service_healthy
      ak_redis:
        condition: service_healthy
    networks:
      - simulation1_network



# ============================================================
  # １７　　v11) VSOP Ops Service (opssvc)
  # ============================================================
  opssvc:
    build:
      context: .
      dockerfile: services/opssvc/Dockerfile
    restart: unless-stopped
    ports:
      - "9011:9011"
    environment:
      OPSSVC_PORT: "9011"
      AK_DB_DSN: postgres://ak:ak@ak_postgres:5432/ak?sslmode=disable
      AK_REDIS_ADDR: ak_redis:6379
      TZ: Asia/Tokyo
    volumes:
      - ./services/opssvc/var:/var/opssvc
    depends_on:
      ak_postgres:
        condition: service_healthy
      ak_redis:
        condition: service_healthy
    networks:
      - simulation1_network




# ============================================================
  # １８　　v12) Decision Core Service (decisioncoresvc)
  # ============================================================
  decisioncoresvc:
    build:
      context: .
      dockerfile: services/decisioncoresvc/Dockerfile
    environment:
      AK_DB_DSN: postgres://decisioncoresvc:decisioncoresvc@ak_postgres:5432/ak?sslmode=disable
      AK_PROJECT_ID: seed_project
      AK_PIPELINE_VERSION: v23
      AK_POLICY_VERSION_STR: v23
      TZ: Asia/Tokyo
    depends_on:
      ak_postgres:
        condition: service_healthy
    networks:
      - simulation1_network
    restart: "no"


  decisioncore_server:
    build:
      context: .
      dockerfile: services/decisioncoresvc/Dockerfile
    environment:
      AK_DB_DSN: postgres://decisioncoresvc:decisioncoresvc@ak_postgres:5432/ak?sslmode=disable
      DECISIONCORESVC_PORT: "9023"
      TZ: Asia/Tokyo
    ports:
      - "9023:9023"
    depends_on:
      ak_postgres:
        condition: service_healthy
    networks:
      - simulation1_network
    command: ["/app/decisioncore_server"]

  decisioncore_worker:
    image: research-stateful-auth-archaeology-decisioncore_server:latest
    entrypoint: ["/app/decisioncore_worker"]
    environment:
      AK_DB_DSN: postgres://decisioncoresvc:decisioncoresvc@ak_postgres:5432/ak?sslmode=disable
      AK_PROJECT_ID: akproj_0000000000000000000
      AK_WORKER_NAME: decisioncore-worker-1
      DECISIONCORE_WORKER_POLL_MS: "500"
      TZ: Asia/Tokyo
    depends_on:
      ak_postgres:
        condition: service_healthy
    networks:
      - simulation1_network
    restart: unless-stopped

  ledgersvc-utl-to-ledger-smoke:
    build:
      context: ./services/ledgersvc
      dockerfile: Dockerfile
    container_name: ledgersvc-utl-to-ledger-smoke
    environment:
      PG_DSN: ${LEDGER_PG_DSN:-postgres://ak:ak@ak_postgres:5432/ak?sslmode=disable}
      PROJECT_ID: ${LEDGER_PROJECT_ID:-akproj_0000000000000000000}
      POLICY_VERSION_ID: ${LEDGER_POLICY_VERSION_ID:-policy_v1_published}
      UTL_EVENT_KEY: ${UTL_EVENT_KEY}
    depends_on:
      ak_postgres:
        condition: service_healthy
    networks:
      - simulation1_network
    restart: "no"
    entrypoint: ["./v1411_utl_to_ledger_smoke"]



  ledgersvc-range-smoke:
    build:
      context: ./services/ledgersvc
      dockerfile: Dockerfile
    container_name: ledgersvc-range-smoke
    environment:
      PG_DSN: ${LEDGER_PG_DSN:-postgres://ak:ak@ak_postgres:5432/ak?sslmode=disable}
      PROJECT_ID: ${LEDGER_PROJECT_ID:-akproj_0000000000000000000}
      POLICY_VERSION_ID: ${LEDGER_POLICY_VERSION_ID:-policy_v1_published}
      FROM_TS: ${FROM_TS:-}
      TO_TS: ${TO_TS:-}
      UTL_STATUS: ${UTL_STATUS:-ingested}
      LEDGERSVC_EVIDENCE_DIR: /var/ledgersvc/evidence
    volumes:
      - ./services/ledgersvc/var:/var/ledgersvc
    depends_on:
      ak_postgres:
        condition: service_healthy
    networks:
      - simulation1_network
    restart: "no"
    entrypoint: ["./v1412_range_smoke"]


# ============================================================
  # １９　　v1４) Ledger Service (ledgersvc) - Smoke Test
  # ============================================================

  ledgersvc-smoke:
    build:
      context: ./services/ledgersvc
      dockerfile: Dockerfile
    container_name: ledgersvc-smoke
    environment:
      # Use AK Postgres (service name: ak_postgres)
      # DB: ak / User: ak / Pass: ak (defined in ak_postgres env)
      PG_DSN: ${LEDGER_PG_DSN:-postgres://ak:ak@ak_postgres:5432/ak?sslmode=disable}
      PROJECT_ID: ${LEDGER_PROJECT_ID:-proj_smoke}
      POLICY_VERSION_ID: ${LEDGER_POLICY_VERSION_ID:-policy_v1_published}
      CURRENCY: ${LEDGER_CURRENCY:-JPY}
    depends_on:
      ak_postgres:
        condition: service_healthy
    networks:
      - simulation1_network
    restart: "no"


  ledgersvc-ingest-smoke:
    build:
      context: ./services/ledgersvc
      dockerfile: Dockerfile
    container_name: ledgersvc-ingest-smoke
    environment:
      PG_DSN: ${LEDGER_PG_DSN:-postgres://ak:ak@ak_postgres:5432/ak?sslmode=disable}
      PROJECT_ID: ${LEDGER_PROJECT_ID:-seed_project}
      POLICY_VERSION_ID: ${LEDGER_POLICY_VERSION_ID:-policy_v1_published}
    depends_on:
      ak_postgres:
        condition: service_healthy
    networks:
      - simulation1_network
    restart: "no"
    entrypoint: ["./v141_ingest_smoke"]


  ledgersvc-server:
    build:
      context: ./services/ledgersvc
      dockerfile: Dockerfile
    container_name: ledgersvc-server
    environment:
      PG_DSN: ${LEDGER_PG_DSN:-postgres://ak:ak@ak_postgres:5432/ak?sslmode=disable}
      LEDGERSVC_ADDR: ":9031"
      LEDGERSVC_EVIDENCE_DIR: /var/ledgersvc/evidence
    volumes:
      - ./services/ledgersvc/var:/var/ledgersvc
    depends_on:
      ak_postgres:
        condition: service_healthy
    networks:
      - simulation1_network
    ports:
      - "9031:9031"
    restart: unless-stopped
    entrypoint: ["./ledgersvc_server"]


# ============================================================
  # 20) v15) Ledger Ingestor (ledgersvc_ingestor)
  # ============================================================


  runschedsvc:
    build:
      context: ./services/runschedsvc
      dockerfile: Dockerfile
    environment:
      AK_PROJECT_ID: akproj_0000000000000000000
      AK_PG_DSN: postgres://ak:ak@ak_postgres:5432/ak?sslmode=disable
      RUNSCHED_FORCE_BUDGET_DENY: "true"
      RUNSCHED_TICK_EVERY: "60s"
      RUNSCHED_DISPATCH_EVERY: "2s"
      RUNSCHED_TICK_LIMIT: "50"
      RUNSCHED_DISPATCH_LIMIT: "200"
      RUNSCHED_CRON_PREVIEW_LIMIT: "200"
    depends_on:
      ak_postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
    networks:
      - simulation1_network


# ============================================================
  # 21) v16) Ledger Service - Range Smoke Test (ledgersvc-range-smoke)
  # ============================================================

  opa:
    image: openpolicyagent/opa:latest
    command: ["run","--server","--addr=0.0.0.0:8181","/policies"]
    volumes:
      - ./services/opagateway/opa:/policies:ro
    ports:
      - "8181:8181"
    networks:
      - simulation1_network


  opagateway_ci:
    build:
      context: ./services/opagateway
      dockerfile: Dockerfile
    environment:
      AK_PG_DSN: postgres://ak:ak@ak_postgres:5432/ak?sslmode=disable
      AK_PROJECT_ID: akproj_0000000000000000000
      OPA_BASE_URL: http://opa:8181
    depends_on:
      ak_postgres:
        condition: service_healthy
      opa:
        condition: service_started
    networks:
      - simulation1_network
    restart: "no"



  wormexportersvc:
    build:
      context: ./services/wormexportersvc
      dockerfile: Dockerfile
    environment:
      AK_PG_DSN: postgres://ak:ak@ak_postgres:5432/ak?sslmode=disable
      AK_PROJECT_ID: akproj_0000000000000000000
      WORM_SINK: localfile
      WORM_OUT_DIR: /var/wormexporter/out
      WORM_EXPORT_LIMIT: "50"
      WORM_EXPORT_EVERY: "60s"
      WORM_ONCE: "false"
      TZ: Asia/Tokyo
    volumes:
      - ./services/wormexportersvc/var:/var/wormexporter
    depends_on:
      ak_postgres:
        condition: service_healthy
    networks:
      - simulation1_network
    restart: unless-stopped

  wormexporter_smoke:
    build:
      context: ./services/wormexportersvc
      dockerfile: Dockerfile
    environment:
      AK_PG_DSN: postgres://ak:ak@ak_postgres:5432/ak?sslmode=disable
      AK_PROJECT_ID: akproj_0000000000000000000
      WORM_SINK: localfile
      WORM_OUT_DIR: /var/wormexporter/out
      WORM_EXPORT_LIMIT: "10"
      WORM_ONCE: "true"
      TZ: Asia/Tokyo
    volumes:
      - ./services/wormexportersvc/var:/var/wormexporter
    depends_on:
      ak_postgres:
        condition: service_healthy
    networks:
      - simulation1_network
    restart: "no"
    entrypoint: ["sh","-lc","/app/wormexportersvc; echo '[smoke] done'; sleep ${WORM_SMOKE_SLEEP:-60}"]
# ============================================================
# Network Definition
# ============================================================
networks:
  simulation1_network:
    name: simulation1_network # 名前を固定
    driver: bridge

# ============================================================
# Volumes Definition
# ============================================================
volumes:
  mysql_data:
  ak_pgdata:
  ak_redisdata:
  cloudbeaver_workspace: