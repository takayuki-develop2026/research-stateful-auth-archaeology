openapi: 3.0.3
info:
  title: AtlasKernel Platform API
  version: 1.0.0
  description: Single Source of Contract (v24). Implementations must conform.
  license:
    name: Proprietary

servers:
  - url: http://localhost:9023

tags:
  - name: Health
    description: Service health endpoints.
  - name: Policy
    description: Policy evaluation endpoints.
  - name: Decisions
    description: Decision ledger and apply endpoints.
  - name: Ledger
    description: Ledger ingest runs (v14) read-only endpoints.
  - name: Evidence
    description: Evidence assets read-only endpoints.

# ✅ required by lint (security-defined rule)
security:
  - bearerAuth: []

paths:
  /health:
    get:
      tags: [Health]
      operationId: getHealth
      summary: Health check
      responses:
        "200":
          description: OK
          headers:
            X-Trace-Id:
              $ref: "#/components/headers/XTraceId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "500":
          description: Internal (soft failure)
          headers:
            X-Trace-Id:
              $ref: "#/components/headers/XTraceId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/projects/{project_id}/policy/evaluate:
    post:
      tags: [Policy]
      operationId: postPolicyEvaluate
      summary: Policy evaluate (MVP)
      parameters:
        - $ref: "#/components/parameters/ProjectIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PolicyEvaluateRequest"
      responses:
        "200":
          description: OK
          headers:
            X-Trace-Id:
              $ref: "#/components/headers/XTraceId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicyEvaluateResponse"
        "400":
          description: Bad Request (validation)
          headers:
            X-Trace-Id:
              $ref: "#/components/headers/XTraceId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/projects/{project_id}/decisions:
    post:
      tags: [Decisions]
      operationId: postDecisionPropose
      summary: Decision propose (create ledger)
      parameters:
        - $ref: "#/components/parameters/ProjectIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DecisionProposeRequest"
      responses:
        "200":
          description: OK
          headers:
            X-Trace-Id:
              $ref: "#/components/headers/XTraceId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DecisionProposeResponse"
        "400":
          description: Bad Request
          headers:
            X-Trace-Id:
              $ref: "#/components/headers/XTraceId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/projects/{project_id}/decisions/{decision_id}/approve:
    post:
      tags: [Decisions]
      operationId: postDecisionApprove
      summary: Approve a decision
      parameters:
        - $ref: "#/components/parameters/ProjectIdPath"
        - $ref: "#/components/parameters/DecisionIdPath"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DecisionApproveRequest"
      responses:
        "200":
          description: OK
          headers:
            X-Trace-Id:
              $ref: "#/components/headers/XTraceId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DecisionApproveResponse"
        "400":
          description: Bad Request
          headers:
            X-Trace-Id:
              $ref: "#/components/headers/XTraceId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/projects/{project_id}/decisions/{decision_id}/apply:
    post:
      tags: [Decisions]
      operationId: postDecisionApply
      summary: Apply a decision (enqueue action) with gate
      description: v23 gate - if decision is not approved, actions=[] and blocked_reason is returned.
      parameters:
        - $ref: "#/components/parameters/ProjectIdPath"
        - $ref: "#/components/parameters/DecisionIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DecisionApplyRequest"
      responses:
        "200":
          description: OK (including blocked cases)
          headers:
            X-Trace-Id:
              $ref: "#/components/headers/XTraceId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DecisionApplyResponse"
        "400":
          description: Bad Request
          headers:
            X-Trace-Id:
              $ref: "#/components/headers/XTraceId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/projects/{project_id}/ledger/ingest-runs:
    get:
      tags: [Ledger]
      operationId: listLedgerIngestRuns
      summary: List ledger ingest runs
      description: Read-only. Returns run-based UTL→Ledger ingest runs (v14.1+).
      parameters:
        - $ref: "#/components/parameters/ProjectIdPath"
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [accepted, running, succeeded, failed_recorded]
          description: Filter by ingest run status.
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: RFC3339 lower bound for created_at (inclusive).
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: RFC3339 upper bound for created_at (exclusive).
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 50
          description: Max items.
      responses:
        "200":
          description: OK
          headers:
            X-Trace-Id:
              $ref: "#/components/headers/XTraceId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LedgerIngestRunListResponse"
        "400":
          description: Bad Request
          headers:
            X-Trace-Id:
              $ref: "#/components/headers/XTraceId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Error
          headers:
            X-Trace-Id:
              $ref: "#/components/headers/XTraceId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/projects/{project_id}/ledger/ingest-runs/{ingest_run_id}:
    get:
      tags: [Ledger]
      operationId: getLedgerIngestRun
      summary: Get ledger ingest run
      description: Read-only. Returns a single ingest run by id (v14.1+).
      parameters:
        - $ref: "#/components/parameters/ProjectIdPath"
        - $ref: "#/components/parameters/IngestRunIdPath"
      responses:
        "200":
          description: OK
          headers:
            X-Trace-Id:
              $ref: "#/components/headers/XTraceId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LedgerIngestRun"
        "404":
          description: Not Found
          headers:
            X-Trace-Id:
              $ref: "#/components/headers/XTraceId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "400":
          description: Bad Request
          headers:
            X-Trace-Id:
              $ref: "#/components/headers/XTraceId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Error
          headers:
            X-Trace-Id:
              $ref: "#/components/headers/XTraceId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/projects/{project_id}/evidence/{evidence_ref}:
    get:
      tags: [Evidence]
      operationId: getEvidenceAssetByRef
      summary: Get evidence asset by evidence_ref
      description: Read-only. Returns evidence_assets row by (project_id, evidence_ref).
      parameters:
        - $ref: "#/components/parameters/ProjectIdPath"
        - $ref: "#/components/parameters/EvidenceRefPath"
      responses:
        "200":
          description: OK
          headers:
            X-Trace-Id:
              $ref: "#/components/headers/XTraceId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceAsset"
        "404":
          description: Not Found
          headers:
            X-Trace-Id:
              $ref: "#/components/headers/XTraceId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "400":
          description: Bad Request
          headers:
            X-Trace-Id:
              $ref: "#/components/headers/XTraceId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Error
          headers:
            X-Trace-Id:
              $ref: "#/components/headers/XTraceId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        Bearer token (user/service). In v24 this is mandatory by contract.

  parameters:
    ProjectIdPath:
      name: project_id
      in: path
      required: true
      schema:
        type: string
      example: akproj_0000000000000000000

    DecisionIdPath:
      name: decision_id
      in: path
      required: true
      schema:
        type: integer
        format: int64
      example: 9

    IngestRunIdPath:
      name: ingest_run_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      example: b8233105-68ab-4cdd-8118-b6a59d030355

    EvidenceRefPath:
      name: evidence_ref
      in: path
      required: true
      schema:
        type: string
        format: uuid
      example: 3699b593-a3e2-4dd6-8d8b-9d61f099fa04

  headers:
    XTraceId:
      description: Trace ID echoed back by server.
      schema:
        type: string

  schemas:
    HealthResponse:
      type: object
      required: [ok, now]
      properties:
        ok:
          type: boolean
          example: true
        now:
          type: string
          format: date-time

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [type, message, trace_id]
          properties:
            type:
              type: string
              example: bad_request
            message:
              type: string
              example: missing required fields
            trace_id:
              type: string
              example: trc_v24_sample

    PolicyEvaluateRequest:
      type: object
      required:
        - run_id
        - policy_version_str
        - pipeline_version
        - inputs_evidence_asset_id
        - reason_evidence_asset_id
        - obligations_evidence_asset_id
      properties:
        run_id:
          type: string
          example: "00000000-0000-0000-0000-000000000000"
        policy_version_str:
          type: string
          example: v23
        pipeline_version:
          type: string
          example: v23
        inputs_evidence_asset_id:
          type: integer
          format: int64
          example: 68
        reason_evidence_asset_id:
          type: integer
          format: int64
          example: 69
        obligations_evidence_asset_id:
          type: integer
          format: int64
          example: 44

    PolicyEvaluateResponse:
      type: object
      required: [input_hash, policy_evaluation_id, result, trace_id]
      properties:
        input_hash:
          type: string
          example: "f475fdf47ee7a1b7d5a381cc56b4dd5c7ad8f25c0f1ae8f904ae9b1328e312cc"
        policy_evaluation_id:
          type: integer
          format: int64
          example: 11
        result:
          type: string
          example: allow
        trace_id:
          type: string
          example: trc_v24_ok

    DecisionProposeRequest:
      type: object
      required:
        - run_id
        - policy_evaluation_id
        - subject_type
        - subject_id
        - decision_scope
        - policy_version_str
        - pipeline_version
        - input_hash
        - inputs_evidence_asset_id
        - obligations_evidence_asset_id
      properties:
        run_id:
          type: string
        policy_evaluation_id:
          type: integer
          format: int64
        subject_type:
          type: string
        subject_id:
          type: string
        decision_scope:
          type: string
        policy_version_str:
          type: string
        pipeline_version:
          type: string
        input_hash:
          type: string
        inputs_evidence_asset_id:
          type: integer
          format: int64
        obligations_evidence_asset_id:
          type: integer
          format: int64

    DecisionProposeResponse:
      type: object
      required: [decision_id, decision_key, status, trace_id]
      properties:
        decision_id:
          type: integer
          format: int64
        decision_key:
          type: string
        status:
          type: string
          example: proposed
        trace_id:
          type: string

    DecisionApproveRequest:
      type: object
      properties:
        decided_by_id:
          type: string
          example: curl

    DecisionApproveResponse:
      type: object
      required: [decision_id, status, trace_id]
      properties:
        decision_id:
          type: integer
          format: int64
        status:
          type: string
          example: approved
        trace_id:
          type: string

    DecisionApplyRequest:
      type: object
      required:
        - run_id
        - target_evidence_asset_id
        - plan_evidence_asset_id
      properties:
        run_id:
          type: string
        action_type:
          type: string
          example: publish_http
        action_scope:
          type: string
          example: managed
        target_evidence_asset_id:
          type: integer
          format: int64
          example: 45
        plan_evidence_asset_id:
          type: integer
          format: int64
          example: 46
        budget_currency:
          type: string
          example: usd_micros
        budget_estimate_amount:
          type: integer
          format: int64
          example: 1000

    DecisionApplyResponse:
      type: object
      required: [trace_id, decision_id, actions]
      properties:
        trace_id:
          type: string
        decision_id:
          type: integer
          format: int64
        decision_status:
          type: string
        decision_kind:
          type: string
        blocked_reason:
          type: string
        actions:
          type: array
          items:
            $ref: "#/components/schemas/ActionRef"

    ActionRef:
      type: object
      required: [action_id, status]
      properties:
        action_id:
          type: integer
          format: int64
        status:
          type: string
          example: queued

    LedgerIngestRunListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/LedgerIngestRun"

    LedgerIngestRun:
      type: object
      required:
        - id
        - project_id
        - mode
        - filter
        - idempotency_key
        - status
        - run_id
        - trace_id
        - policy_version_id
        - stats
        - evidence_refs
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        project_id:
          type: string
        mode:
          type: string
          enum: [single_event, range]
        source_event_key:
          type: string
          nullable: true
          description: Present when mode=single_event.
        from_ts:
          type: string
          format: date-time
          nullable: true
        to_ts:
          type: string
          format: date-time
          nullable: true
        filter:
          type: object
          additionalProperties: true
        idempotency_key:
          type: string
        status:
          type: string
          enum: [accepted, running, succeeded, failed_recorded]
        run_id:
          type: string
        trace_id:
          type: string
        policy_version_id:
          type: string
        stats:
          type: object
          additionalProperties: true
        evidence_refs:
          type: array
          items:
            type: string
            format: uuid
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    EvidenceAsset:
      type: object
      required:
        - id
        - project_id
        - evidence_ref
        - media_type
        - source_kind
        - content_sha256
        - content_length
        - mime_type
        - retention_policy
        - status
        - created_by_type
        - created_at
        - updated_at
      properties:
        id:
          type: integer
          format: int64
        project_id:
          type: string
        evidence_ref:
          type: string
          format: uuid
        media_type:
          type: string
          enum: [text, image, audio, video, binary]
        source_kind:
          type: string
          enum: [pisag_fetch, upload, webhook, generated, import]
        source_uri:
          type: string
          nullable: true
        content_sha256:
          type: string
          minLength: 64
          maxLength: 64
        content_length:
          type: integer
          format: int64
        mime_type:
          type: string
        language:
          type: string
          nullable: true
        retention_policy:
          type: string
          enum: [short, standard, legal_hold]
        expires_at_utc:
          type: string
          format: date-time
          nullable: true
        status:
          type: string
          enum: [active, expired, tombstoned]
        created_by_type:
          type: string
          enum: [system, user, service]
        created_by_id:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time